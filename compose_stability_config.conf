// Compose 컴파일러 안정성 설정
//
// 여기 적힌 타입은 컴파일러가 stable 로 간주한다. 실제로 불변인데도 다른 모듈/라이브러리에
// 있어 컴파일러가 판단할 수 없는 타입만 넣는다. 가변 타입을 여기 적으면 상태 변경이
// 화면에 반영되지 않는 버그가 생기므로, 불변임을 확인한 것만 등록한다.

// java.time — 모두 불변 값 타입 (JSR-310 명세)
java.time.LocalDate
java.time.LocalTime
java.time.LocalDateTime
java.time.YearMonth
java.time.Instant
java.time.Duration
java.time.format.DateTimeFormatter

// kotlinx.collections.immutable — 이름 그대로 불변
kotlinx.collections.immutable.**

// domain 모듈의 모델 — java-library 모듈이라 Compose 컴파일러가 분석하지 못한다.
// 195개 data class 전수 확인 결과 var 필드 0건, 가변 컬렉션(MutableList/Map/Set) 0건으로
// 모두 불변이다. UiState 가 이 타입들을 품고 있어 여기서 막히면 화면 전체가 계속 unstable 이 된다.
// (새 모델을 추가할 때 var 를 쓰면 이 선언이 거짓이 되므로 val 로 유지해야 한다)
com.umc.domain.model.**
