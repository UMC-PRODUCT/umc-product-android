# Gemini Code Assist 저장소 설정. 스키마: https://docs.cloud.google.com/gemini/docs/code-review/customize-repo-review
# 리뷰 지시문(한국어 응답 등)은 이 파일에 둘 수 없어 같은 폴더의 styleguide.md 에 둔다.

code_review:
  # 마이너한 개선 제안까지 포함한다.
  comment_severity_threshold: LOW
  pull_request_opened:
    summary: true
    code_review: true

# 분석에서 뺄 경로
ignore_patterns:
  # 빌드 및 자동 생성 코드
  - "**/build/**"
  - "**/generated/**"
  - "**/.gradle/**"
  - "**/gradle/wrapper/**"

  # 리소스 및 바이너리 파일
  - "**/res/drawable*/**"
  - "**/res/mipmap*/**"
  - "**/res/raw/**"
  - "**/*.png"
  - "**/*.webp"
  - "**/*.jpg"

  # IDE 및 로컬 설정
  - ".idea/**"
  - "**/*.iml"
  - "local.properties"
  - ".vscode/**"
