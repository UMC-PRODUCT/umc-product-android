name: Android CI/CD

# 배포 규칙
#   main 브랜치 푸시 → 검사 후 버전을 자동으로 올려 프로덕션 배포하고, 성공하면 태그를 남긴다
#                      ([Feat] 커밋이 있으면 minor, BREAKING CHANGE 면 major, 아니면 patch)
#   v* 태그 푸시     → 그 태그 버전 그대로 프로덕션 배포 (자동 증가를 건너뛰고 싶을 때)
#   develop-compose  → API dev 서버 → Play 내부 테스트 트랙 (versionName = <최신태그>-dev.N)
#   PR               → 변경된 모듈과 그 역의존만 검사 (배포 없음)

on:
  push:
    branches: [ main, develop-compose ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop-compose ]
  workflow_dispatch:
    inputs:
      track:
        description: "수동 실행 시 배포 트랙"
        type: choice
        default: internal
        options: [ internal, alpha, beta, production ]
      bump:
        description: "버전 증가 방식 (main 자동 릴리스에만 적용)"
        type: choice
        default: auto
        options: [ auto, patch, minor, major ]
      simulate_main:
        description: "main 자동 릴리스 경로 리허설 (태그를 rehearsal-v 접두사로 남긴다)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────────
  # 1. 검사 및 빌드
  # ────────────────────────────────────────────────────────────────
  verify:
    name: 검사 및 빌드
    runs-on: ubuntu-latest
    outputs:
      api-env: ${{ steps.resolve.outputs.api-env }}
      flavor-cap: ${{ steps.resolve.outputs.flavor-cap }}
      track: ${{ steps.resolve.outputs.track }}
      version-code: ${{ steps.resolve.outputs.version-code }}
      version-name: ${{ steps.resolve.outputs.version-name }}
      deploy: ${{ steps.resolve.outputs.deploy }}
      scope: ${{ steps.resolve.outputs.scope }}
      tag-after: ${{ steps.resolve.outputs.tag-after }}
      tag-prefix: ${{ steps.resolve.outputs.tag-prefix }}
      notes-from: ${{ steps.resolve.outputs.notes-from }}

    steps:
      - name: 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # git describe 로 최신 태그를 읽고 PR 변경 파일을 계산한다

      - name: 배포 대상·버전 결정
        id: resolve
        env:
          MANUAL_TRACK: ${{ inputs.track }}
          MANUAL_BUMP: ${{ inputs.bump }}
          SIMULATE_MAIN: ${{ inputs.simulate_main }}
        run: |
          set -euo pipefail
          # 릴리스 태그(vX.Y.Z)만 버전 계산에 쓴다. rehearsal-v* 등은 무시된다.
          LATEST_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || echo "v0.0.0")
          BRANCH="${{ github.base_ref || github.ref_name }}"
          TAG_AFTER=false
          TAG_PREFIX=v

          # 리허설: 실제 브랜치와 무관하게 main 경로를 그대로 태운다.
          # 태그는 rehearsal-v 접두사로 남겨 릴리스 태그 네임스페이스를 오염시키지 않는다.
          if [ "${SIMULATE_MAIN:-false}" = "true" ]; then
            BRANCH=main
            TAG_PREFIX="rehearsal-v"
            echo "::notice::main 자동 릴리스 리허설 모드 — 태그 접두사 $TAG_PREFIX"
          fi

          # 최신 태그 이후 커밋으로 증가 폭을 정한다.
          # 이 레포의 컨벤션은 [Feat] / [Fix] / [Chore] 형태다.
          decide_bump() {
            if [ -n "${MANUAL_BUMP:-}" ] && [ "$MANUAL_BUMP" != "auto" ]; then
              printf '%s' "$MANUAL_BUMP"; return
            fi
            local range="HEAD"
            if git rev-parse "$LATEST_TAG" >/dev/null 2>&1; then range="${LATEST_TAG}..HEAD"; fi
            # major 는 Conventional Commits 의 푸터 형식만 인정한다 —
            # 줄 맨 앞의 "BREAKING CHANGE:" (콜론 필수).
            # 규칙을 설명하는 문장이 본문에 섞였다고 major 로 튀면 안 된다.
            local body; body=$(git log --format='%B' "$range" 2>/dev/null || printf '')
            # minor 는 커밋 "제목"만 본다. 본문에 [Feat] 를 언급한 것까지 세지 않는다.
            local subjects; subjects=$(git log --format='%s' "$range" 2>/dev/null || printf '')
            if printf '%s' "$body" | grep -qE '^BREAKING[ -]CHANGE:'; then printf 'major'
            elif printf '%s' "$subjects" | grep -qiE '^\[?(feat|feature)'; then printf 'minor'
            else printf 'patch'; fi
          }

          bump_version() {
            local cur="${1#v}" kind="$2" ma mi pa
            IFS=. read -r ma mi pa <<< "$cur"
            ma=${ma:-0}; mi=${mi:-0}; pa=${pa:-0}
            case "$kind" in
              major) ma=$((ma + 1)); mi=0; pa=0 ;;
              minor) mi=$((mi + 1)); pa=0 ;;
              *)     pa=$((pa + 1)) ;;
            esac
            printf '%s.%s.%s' "$ma" "$mi" "$pa"
          }

          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            # v3.1.0 형태만 허용한다. 오타로 엉뚱한 버전이 프로덕션에 나가는 것을 막는다.
            if ! printf '%s' "$GITHUB_REF_NAME" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::릴리스 태그는 vMAJOR.MINOR.PATCH 형식이어야 합니다 (입력: $GITHUB_REF_NAME)"
              exit 1
            fi
            API_ENV=prod; TRACK=production; DEPLOY=true
            VERSION_NAME="${GITHUB_REF_NAME#v}"
            # HEAD 가 이 태그 자체이므로 직전 커밋 기준으로 이전 릴리스를 찾는다.
            NOTES_FROM=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' HEAD^ 2>/dev/null || echo "")
          else
            case "$BRANCH" in
              develop-compose)
                API_ENV=dev; TRACK=internal; DEPLOY=true
                VERSION_NAME="${LATEST_TAG#v}-dev.${GITHUB_RUN_NUMBER}"
                ;;
              main)
                # 검사를 통과하면 버전을 자동으로 올려 프로덕션에 내보내고,
                # Play 업로드가 성공한 뒤에야 태그를 남긴다(실패한 버전 번호를 태우지 않기 위해).
                API_ENV=prod; TRACK=production; DEPLOY=true; TAG_AFTER=true
                BUMP=$(decide_bump)
                VERSION_NAME=$(bump_version "$LATEST_TAG" "$BUMP")
                echo "최신 태그 $LATEST_TAG 기준 $BUMP 증가 -> $VERSION_NAME"
                # 이 커밋이 이미 릴리스된 상태면(재실행 등) 버전을 또 올리지 않는다.
                if git rev-parse "$LATEST_TAG" >/dev/null 2>&1 \
                   && [ "$(git rev-list --count "${LATEST_TAG}..HEAD")" = "0" ]; then
                  echo "::notice::HEAD 가 이미 $LATEST_TAG 로 릴리스되어 있어 배포를 건너뜁니다."
                  DEPLOY=false; TAG_AFTER=false
                  VERSION_NAME="${LATEST_TAG#v}"
                fi
                ;;
              *)
                API_ENV=dev; TRACK=internal; DEPLOY=false
                VERSION_NAME="${LATEST_TAG#v}-dev.${GITHUB_RUN_NUMBER}"
                ;;
            esac
          fi

          # 수동 실행은 항상 배포한다 (트랙은 입력값).
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            DEPLOY=true
            if [ -n "$MANUAL_TRACK" ]; then TRACK="$MANUAL_TRACK"; fi
          fi
          # PR 은 어떤 경우에도 배포하지 않는다.
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then DEPLOY=false; fi

          # PR 만 축약 검사. 배포로 이어지는 경로는 항상 전체 검사한다.
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then SCOPE=affected; else SCOPE=full; fi

          # Play 는 동일 versionCode 재업로드를 거부한다. 실행 횟수로 단조 증가시킨다.
          # (파이프라인 도입 시점의 Play 최신 versionCode 가 21)
          VERSION_CODE=$(( 21 + GITHUB_RUN_NUMBER ))
          # 태그 푸시가 아니면 현재까지의 최신 릴리스 태그가 비교 기준이다.
          NOTES_FROM="${NOTES_FROM-$LATEST_TAG}"
          if [ "$NOTES_FROM" = "v0.0.0" ]; then NOTES_FROM=""; fi

          {
            # Gradle 태스크 이름에 쓰는 대문자 시작 형태 (dev -> Dev)
            FLAVOR_CAP="$(printf '%s' "${API_ENV:0:1}" | tr '[:lower:]' '[:upper:]')${API_ENV:1}"
            echo "flavor-cap=$FLAVOR_CAP"
            echo "api-env=$API_ENV"
            echo "track=$TRACK"
            echo "deploy=$DEPLOY"
            echo "tag-after=$TAG_AFTER"
            echo "tag-prefix=$TAG_PREFIX"
            echo "notes-from=$NOTES_FROM"
            echo "scope=$SCOPE"
            echo "version-code=$VERSION_CODE"
            echo "version-name=$VERSION_NAME"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### 🎯 대상"
            echo ""
            echo "| 항목 | 값 |"
            echo "| --- | --- |"
            echo "| ref | \`${GITHUB_REF_NAME}\` (${GITHUB_REF_TYPE:-branch}) |"
            echo "| API 환경 | \`$API_ENV\` |"
            echo "| 버전 | \`$VERSION_NAME\` (code \`$VERSION_CODE\`) |"
            echo "| 검사 범위 | \`$SCOPE\` |"
            echo "| 배포 | $([ "$DEPLOY" = true ] && echo "\`$TRACK\`" || echo "없음") |"
          } >> "$GITHUB_STEP_SUMMARY"


      - name: 검사할 모듈 계산
        id: affected
        if: steps.resolve.outputs.scope == 'affected'
        run: |
          set -euo pipefail
          # fetch-depth: 0 으로 전체 이력을 받아뒀으므로 base 와의 merge-base 비교가 가능하다.
          CHANGED=$(git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" || true)
          if [ -z "$CHANGED" ]; then
            echo "변경 파일을 계산하지 못했습니다 — 전체 검사로 후퇴합니다."
            echo "tasks=ALL" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "변경된 파일:"; printf '%s\n' "$CHANGED" | sed 's/^/  /'
          TASKS=$(printf '%s\n' "$CHANGED" | python3 .github/scripts/affected_modules.py "${{ steps.resolve.outputs.api-env }}")
          echo "tasks=$TASKS" >> "$GITHUB_OUTPUT"
          {
            echo ""
            echo "### 📦 축약 검사 대상"
            echo ""
            if [ "$TASKS" = "ALL" ]; then
              echo "전역 파일이 바뀌어 전 모듈을 검사합니다."
            else
              printf '%s\n' "$TASKS" | tr ' ' '\n' | sed 's/^/- `/;s/$/`/'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: JDK 17 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 준비
        uses: gradle/actions/setup-gradle@v4

      - name: 시크릿 복원
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          KAKAO_NATIVE_KEY: ${{ secrets.KAKAO_NATIVE_KEY }}
          KAKAO_APP_KEY: ${{ secrets.KAKAO_APP_KEY }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          GOOGLE_LOGIN_KEY: ${{ secrets.GOOGLE_LOGIN_KEY }}
        run: |
          chmod +x ./gradlew
          printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
          cat > local.properties <<EOF
          kakao.native.key=$KAKAO_NATIVE_KEY
          kakao.app.key=$KAKAO_APP_KEY
          kakao.rest.key=$KAKAO_REST_KEY
          naver.client.id=$NAVER_CLIENT_ID
          google.login.key=$GOOGLE_LOGIN_KEY
          EOF

      - name: 커스텀 Lint 규칙 자체 테스트
        run: ./gradlew :lint-rules:test --console=plain

      # 배포로 이어지는 경로: 전 모듈 테스트 + app 이 의존성까지 훑는 lint
      - name: 테스트·Lint (전체)
        if: steps.resolve.outputs.scope == 'full'
        run: |
          F=${{ steps.resolve.outputs.flavor-cap }}
          # 라이브러리 모듈은 flavor 가 없어 testDebugUnitTest 그대로, :app 만 flavor 태스크.
          ./gradlew testDebugUnitTest \
            ":app:test${F}DebugUnitTest" ":app:lint${F}Debug" \
            --console=plain

      # PR: 변경된 모듈과 그 역의존만. 각 모듈이 자기 lintChecks 를 등록하고 있으므로
      # app 의 checkDependencies 를 꺼도 커스텀 규칙 커버리지는 유지된다.
      - name: 테스트·Lint (축약)
        if: steps.resolve.outputs.scope == 'affected'
        env:
          TASKS: ${{ steps.affected.outputs.tasks }}
        run: |
          set -euo pipefail
          if [ "$TASKS" = "ALL" ]; then
            F=${{ steps.resolve.outputs.flavor-cap }}
            ./gradlew testDebugUnitTest \
              ":app:test${F}DebugUnitTest" ":app:lint${F}Debug" --console=plain
          else
            # shellcheck disable=SC2086
            ./gradlew $TASKS \
              -PlintCheckDependencies=false \
              --console=plain
          fi

      # :lint-rules 가 스스로 선언한 severity 를 그대로 신뢰한다.
      # ERROR(OneShotEventSharedFlow) 는 파이프라인을 세우고, WARNING 은 요약에만 남긴다.
      - name: UMC 커스텀 Lint 게이트
        run: |
          python3 - <<'PY'
          import os, sys, xml.etree.ElementTree as ET
          from pathlib import Path

          UMC = {"OneShotEventSharedFlow", "LifecycleUnawareEventCollect", "BlockingCallInRequestPath"}
          reports = sorted(Path(".").glob("**/build/reports/lint-results-debug.xml"))
          if not reports:
              print("lint 리포트가 없습니다 — 검사 대상 모듈이 없었을 수 있습니다.")
              sys.exit(0)

          errors, warnings = [], []
          for report in reports:
              for issue in ET.parse(report).getroot().iter("issue"):
                  if issue.get("id") not in UMC:
                      continue
                  loc = issue.find("location")
                  where = "%s:%s" % (loc.get("file", "?").split("/")[-1], loc.get("line", "?"))
                  row = (issue.get("id"), where, issue.get("message", ""))
                  bucket = errors if issue.get("severity") == "Error" else warnings
                  if row not in bucket:
                      bucket.append(row)

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("\n### 🔍 UMC 커스텀 Lint\n\n")
              f.write("- 리포트 %d개 · 오류 %d건 / 경고 %d건\n\n" % (len(reports), len(errors), len(warnings)))
              for iid, where, msg in errors + warnings:
                  f.write("- `%s` %s — %s\n" % (iid, where, msg))

          for iid, where, msg in warnings:
              print("::warning file=%s::[%s] %s" % (where.split(":")[0], iid, msg))
          for iid, where, msg in errors:
              print("::error file=%s::[%s] %s" % (where.split(":")[0], iid, msg))

          if errors:
              sys.exit("UMC 커스텀 Lint 오류 %d건 — 배포를 중단합니다." % len(errors))
          print("UMC 커스텀 Lint 오류 없음 (리포트 %d개, 경고 %d건)" % (len(reports), len(warnings)))
          PY

      - name: 빌드 검증 (Debug)
        env:
          VERSION_NAME: ${{ steps.resolve.outputs.version-name }}
        run: ./gradlew ":app:assemble${{ steps.resolve.outputs.flavor-cap }}Debug" --console=plain

      # 브랜치에 맞는 서버 주소와 버전이 실제로 박혔는지 확인한다.
      # 이 검사가 없으면 flavor 를 잘못 지정해도 조용히 엉뚱한 서버로 빌드된다.
      - name: 서버 주소·버전 검증
        env:
          API_ENV: ${{ steps.resolve.outputs.api-env }}
          EXPECTED_VERSION: ${{ steps.resolve.outputs.version-name }}
        run: |
          set -euo pipefail
          case "$API_ENV" in
            prod) EXPECTED_URL="https://api.university.neordinary.com/" ;;
            dev)  EXPECTED_URL="https://api-dev.university.neordinary.com/" ;;
            *)    echo "::error::알 수 없는 flavor: $API_ENV"; exit 1 ;;
          esac
          GEN="app/build/generated/source/buildConfig/${API_ENV}/debug/com/umc/product/BuildConfig.java"
          ACTUAL_URL=$(sed -n 's/.*BASE_URL = "\(.*\)";/\1/p' "$GEN")
          if [ "$ACTUAL_URL" != "$EXPECTED_URL" ]; then
            echo "::error::서버 주소 불일치 — 기대 $EXPECTED_URL / 실제 $ACTUAL_URL"
            exit 1
          fi
          echo "### 🌐 서버 주소 \`$ACTUAL_URL\`" >> "$GITHUB_STEP_SUMMARY"

      - name: 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.run_number }}
          path: |
            **/build/reports/tests/**
            **/build/reports/lint-results-debug.*
          retention-days: 7
          if-no-files-found: ignore

  # ────────────────────────────────────────────────────────────────
  # 2. Play Store 배포 (검사 통과 후에만)
  # ────────────────────────────────────────────────────────────────
  deploy:
    name: Play Store 배포 (${{ needs.verify.outputs.track }})
    needs: verify
    if: needs.verify.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 태그와 GitHub Release 를 남긴다

    steps:
      - name: 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 릴리스 노트를 만들려면 이전 태그까지의 커밋이 필요하다

      - name: JDK 17 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 준비
        uses: gradle/actions/setup-gradle@v4

      - name: 시크릿 · 키스토어 복원
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KAKAO_NATIVE_KEY: ${{ secrets.KAKAO_NATIVE_KEY }}
          KAKAO_APP_KEY: ${{ secrets.KAKAO_APP_KEY }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          GOOGLE_LOGIN_KEY: ${{ secrets.GOOGLE_LOGIN_KEY }}
        run: |
          chmod +x ./gradlew
          printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > umc_release_key.jks
          cat > local.properties <<EOF
          kakao.native.key=$KAKAO_NATIVE_KEY
          kakao.app.key=$KAKAO_APP_KEY
          kakao.rest.key=$KAKAO_REST_KEY
          naver.client.id=$NAVER_CLIENT_ID
          google.login.key=$GOOGLE_LOGIN_KEY
          EOF

      - name: AAB 빌드
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ needs.verify.outputs.version-code }}
          VERSION_NAME: ${{ needs.verify.outputs.version-name }}
        run: |
          ./gradlew ":app:bundle${{ needs.verify.outputs.flavor-cap }}Release" --console=plain

      - name: 서명 확인
        run: |
          AAB="app/build/outputs/bundle/${{ needs.verify.outputs.api-env }}Release/app-${{ needs.verify.outputs.api-env }}-release.aab"
          test -f "$AAB" || { echo "::error::AAB 를 찾을 수 없습니다"; exit 1; }
          if jarsigner -verify "$AAB" | grep -q "jar verified"; then
            echo "서명 확인 완료: $AAB"
          else
            echo "::error::AAB 가 서명되지 않았습니다 — KEYSTORE_* 시크릿을 확인하세요"
            exit 1
          fi

      # 커밋에서 Play 업데이트 내용과 GitHub Release 본문을 만든다.
      # 앱 코드를 건드리지 않은 커밋(CI/빌드 설정)은 사용자 노트에서 제외된다.
      - name: 릴리스 노트 생성
        id: notes
        env:
          VERSION_NAME: ${{ needs.verify.outputs.version-name }}
          NOTES_FROM: ${{ needs.verify.outputs.notes-from }}
        run: |
          set -euo pipefail
          RANGE="HEAD"
          if [ -n "$NOTES_FROM" ] && git rev-parse "$NOTES_FROM" >/dev/null 2>&1; then
            RANGE="${NOTES_FROM}..HEAD"
          fi
          echo "커밋 범위: $RANGE"
          git log --format=$'\x01%s' --name-only "$RANGE" \
            | python3 .github/scripts/release_notes.py \
                --version "$VERSION_NAME" \
                --prev "$NOTES_FROM" \
                --repo "$GITHUB_REPOSITORY"
          {
            echo ""
            echo "### 📝 Play 업데이트 내용"
            echo ""
            echo '```'
            cat whatsnew/whatsnew-ko-KR
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 난독화 매핑 확인
        run: |
          set -euo pipefail
          MAP="app/build/outputs/mapping/${{ needs.verify.outputs.api-env }}Release/mapping.txt"
          if [ ! -s "$MAP" ]; then
            echo "::error::mapping.txt 가 없습니다 — release 의 isMinifyEnabled 가 꺼졌는지 확인하세요"
            exit 1
          fi
          echo "매핑 파일 $(du -h "$MAP" | cut -f1)"

      - name: Play Store 업로드
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.umc.product
          releaseFiles: app/build/outputs/bundle/${{ needs.verify.outputs.api-env }}Release/app-${{ needs.verify.outputs.api-env }}-release.aab
          track: ${{ needs.verify.outputs.track }}
          status: completed
          # R8 난독화 매핑. 없으면 Play Console 크래시 스택이 난독화된 채로 보인다.
          mappingFile: app/build/outputs/mapping/${{ needs.verify.outputs.api-env }}Release/mapping.txt
          # 커밋에서 생성한 "업데이트 내용". 없으면 Play 가 이전 노트를 유지한다.
          whatsNewDirectory: whatsnew

      # Play 업로드가 성공한 뒤에만 태그를 남긴다. 실패한 버전 번호를 태우지 않는다.
      # GITHUB_TOKEN 으로 민 태그는 새 워크플로를 트리거하지 않으므로 재귀 실행이 없다.
      - name: 릴리스 태그 생성
        if: needs.verify.outputs.tag-after == 'true'
        env:
          VERSION_NAME: ${{ needs.verify.outputs.version-name }}
          TAG_PREFIX: ${{ needs.verify.outputs.tag-prefix }}
        run: |
          set -euo pipefail
          TAG="${TAG_PREFIX}${VERSION_NAME}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "$TAG" >/dev/null 2>&1; then
            echo "::error::태그 $TAG 가 이미 존재합니다 — 버전 계산을 확인하세요"
            exit 1
          fi
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "태그 $TAG 생성"
          echo "| 태그 | \`$TAG\` |" >> "$GITHUB_STEP_SUMMARY"

      # Play 업로드와 태그가 모두 끝난 뒤에만 Release 를 만든다.
      # 이렇게 해야 GitHub Release 와 스토어 출시본이 항상 같은 것을 가리킨다.
      - name: GitHub Release 생성
        if: needs.verify.outputs.tag-after == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ needs.verify.outputs.version-name }}
          TAG_PREFIX: ${{ needs.verify.outputs.tag-prefix }}
        run: |
          set -euo pipefail
          TAG="${TAG_PREFIX}${VERSION_NAME}"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes-file release-notes.md \
            --verify-tag
          echo "GitHub Release $TAG 생성"

      - name: 배포 요약
        run: |
          {
            echo "### 🚀 배포 완료"
            echo ""
            echo "| 항목 | 값 |"
            echo "| --- | --- |"
            echo "| ref | \`${{ github.ref_name }}\` |"
            echo "| API 환경 | \`${{ needs.verify.outputs.api-env }}\` |"
            echo "| 트랙 | \`${{ needs.verify.outputs.track }}\` |"
            echo "| 버전 | \`${{ needs.verify.outputs.version-name }}\` (code \`${{ needs.verify.outputs.version-code }}\`) |"
            echo "| 커밋 | \`${{ github.sha }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ────────────────────────────────────────────────────────────────
  # 3. 배포 결과 알림 (Discord)
  # ────────────────────────────────────────────────────────────────
  notify:
    name: 배포 알림
    needs: [ verify, deploy ]
    # 배포를 시도한 경우에만, 성공이든 실패든 알린다. PR 검사는 알리지 않는다.
    if: always() && needs.verify.outputs.deploy == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Discord 알림
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RESULT: ${{ needs.deploy.result }}
          VERSION_NAME: ${{ needs.verify.outputs.version-name }}
          VERSION_CODE: ${{ needs.verify.outputs.version-code }}
          API_ENV: ${{ needs.verify.outputs.api-env }}
          TRACK: ${{ needs.verify.outputs.track }}
          # 커밋 메시지는 사람이 쓴 임의 문자열이다. 셸에 직접 보간하면 주입 위험이 있어
          # 환경변수로만 전달하고, 파싱은 파이썬 json 으로만 한다.
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          # 이번 푸시에 담긴 커밋 전부. 태그 푸시나 수동 실행이면 비어 있을 수 있어
          # 그때는 head_commit 하나로 대체한다. (GitHub 이 이 배열을 최대 20개로 자른다)
          COMMITS_JSON: ${{ toJSON(github.event.commits) }}
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK:-}" ]; then
            echo "::notice::DISCORD_WEBHOOK_URL 시크릿이 없어 알림을 건너뜁니다."
            exit 0
          fi
          printf '%s' "${COMMIT_MSG:-}" > /tmp/commit_msg
          printf '%s' "${COMMITS_JSON:-}" > /tmp/commits.json
          python3 - <<'PY' > /tmp/payload.json
          import json, os, pathlib

          result = os.environ["RESULT"]
          ok = result == "success"

          # production 트랙만 실제 배포고, internal·alpha·beta 는 테스트 배포로 본다.
          kind = "release" if os.environ["TRACK"] == "production" else "test"
          title = f"✅ ({kind})배포완료" if ok else f"❌ ({kind})배포실패 ({result})"

          def read_commits():
              raw = pathlib.Path("/tmp/commits.json").read_text(encoding="utf-8", errors="replace").strip()
              try:
                  items = json.loads(raw) if raw else []
              except json.JSONDecodeError:
                  items = []
              if items:
                  return items
              # 태그 푸시·수동 실행처럼 commits 가 비는 경우
              subject = pathlib.Path("/tmp/commit_msg").read_text(encoding="utf-8", errors="replace")
              return [{"id": os.environ["GITHUB_SHA"], "message": subject, "author": {}}]

          repo_url = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"

          def commit_line(c):
              sha = (c.get("id") or "")[:7]
              subject = (c.get("message") or "").split("\n")[0].strip() or "(제목 없음)"
              author = (c.get("author") or {}).get("name") or ""
              url = c.get("url") or f"{repo_url}/commit/{c.get('id', '')}"
              tail = f" — {author}" if author else ""
              return f"[`{sha}`]({url}) {subject}{tail}"

          # Discord 필드 값은 1024자가 한계라 넘치기 전에 끊고 몇 개가 빠졌는지 알린다.
          commits = read_commits()
          lines, used = [], 0
          for i, c in enumerate(commits):
              line = commit_line(c)
              more = len(commits) - i
              suffix = f"\n…외 {more}개" if more > 1 else ""
              if used + len(line) + 1 + len(suffix) > 1024:
                  if more > 0:
                      lines.append(f"…외 {more}개")
                  break
              lines.append(line)
              used += len(line) + 1

          payload = {
              "username": "UMC Android CD",
              # 깃허브에서 온 알림임이 한눈에 보이도록 조직 프로필 이미지를 쓴다.
              "avatar_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY_OWNER']}.png",
              "embeds": [{
                  "title": title,
                  "url": f"{repo_url}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
                  "color": 0x2ECC71 if ok else 0xE74C3C,
                  "fields": [
                      {"name": "버전", "value": f"{os.environ['VERSION_NAME']} (code {os.environ['VERSION_CODE']})", "inline": True},
                      {"name": "트랙", "value": os.environ["TRACK"], "inline": True},
                      {"name": "서버", "value": os.environ["API_ENV"], "inline": True},
                      {"name": f"커밋 {len(commits)}건", "value": "\n".join(lines) or "(없음)"},
                  ],
                  "footer": {"text": f"{os.environ['GITHUB_REF_NAME']} · {os.environ['GITHUB_SHA'][:8]}"},
              }],
          }
          print(json.dumps(payload, ensure_ascii=False))
          PY
          # 웹훅 URL 이 로그에 남지 않도록 --data 는 파일에서만 읽는다.
          code=$(curl -sS -o /tmp/resp.txt -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            --data @/tmp/payload.json "$WEBHOOK")
          if [ "$code" -ge 300 ]; then
            echo "::warning::Discord 알림 실패 (HTTP $code): $(head -c 300 /tmp/resp.txt)"
          else
            echo "Discord 알림 전송 완료 (HTTP $code)"
          fi
